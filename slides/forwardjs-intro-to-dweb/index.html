class: center, middle, agbg

## The (Cloud Based) Web


Client 🙋 (GET /index.html) -> Server 🖥️

Server 🖥️ (200 OK `html ....`) -> Client 🥳


---

class: center, middle, agbg

## Trade offs - Cloud

- ✅ It's everywhere!
- ✅ Fast
- ❌ Users must be always online
- ❌ Servers must be maintained
- ❌ Usage spike = cost spike
- ❌ Server can selectively change content
- ❌ Easy target for mass censorship

---

class: center, middle, agbg

## Peer To Peer Protocols

Reader 🙋 (GET {hash}) -> Swarm 🐝 -> Peer ‍🐕‍🦺

Peer 🐕‍🦺 (data) -> Reader 🙋

Reader 🙋 (advertise {hash}) -> Swarm 🐝

---

class: center, middle, agbg

## Hashing

hash(file1) = {`0x00`, `0xF0`, ...}
hash(file2) = {`0x40`, `0x20`, ...}

---

class: center, middle, agbg

## Peer Discovery (Swarm)

- `(hash)` -> `IP`
- Trackers
- Distributed Hash Tables
- Local Network Multicast

---

class: center, middle, agbg

## Trade offs - P2P

- ✅ Existing data works offline
- ✅ Self publish by default
- ✅ More readers = splitting the load
- ❌ Somone must have a copy
- ❌ Can be slower
- ❌ IP Address Privacy
