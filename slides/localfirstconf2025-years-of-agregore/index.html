### 5 Years Of Agregore

<small>Press <b>P</b> for speaker notes</small>

???

Hi friends, thank you for coming out and thanks for having me.

---

class: agbg

## 👁️ State Of Software 👁️

- Cloud Hosting Bills
- Always-online
- Backend/Frontend
- App Stores Gatekeeping

???

I've noticed some common points of friction for getting software into users hands.
First of all making something today means committing to paying for infrastructure indefinitely, else your users data and connections get destroyed.
Systems and users need to be always online, with any downtime or connectivity issues being catastrophic.
Making software is complex with separation between backend developers making massive systems scaleable and front end developers making user interfaces accross different platforms.
For people to actually use your tech you need to register a business and use a different deployment system with every app store you want to be available on.

---

class: agbg

## Leads to:

- Expensive and Complex 💸
- Profit over Usability 🤑
- Filter what may exist 🚫
- Easy target 🫢 (censoring, hacking, etc.)

???

These factors work together to keep software expensive and complex to create,
It forces creators to focus on profit over usability and utility,
It determines what may exist and for how long.
As well, any data your users have becomes your liability.
As an operator you're required to facilitate censorship, copyright takedowns, and to follow laws regulating how to treat data in any country you wish to operate within. The more successful you become the more of a target you become for hacking and exploitation.

---

class: agbg

## "The Dream" 💭

- No infra
- No builds
- Self-publishing

???

I think the state of things sucks and I have a dream of changing it so that creating something means you don't need to deal with any infrastructure costs, no build systems if you don't want them, and can self publish and distribute your software without having to jump through a bunch of hoops.

---

class: agbg

![Screenshot of Agregore browser on the welcome screen](./agscreen.png)

???

This is the dream that's been guiding my work on Agregore the past five years and I wanted to go over a timeline of how this dream has shaped the project over this time.

---

class: beakerbg

### June 2018


![Screenshot of beakerbrowser.com from Feb 2019](./beakerscreen.png)

???

This dream was sparked way before I started working on peer to peer software thanks to the work of Paul Frazee and Tara Vancil on the Beaker Browser.
When I came accross this project it blew my mind that a browser could be a tool for creation in and of itself without needing to depend on cloud infrastructure.
So in June of 2018 I did my first presentation about the Peer to Peer Web at a local meetup in my hometown of Ottawa, Canada.

---

class: agbg

### May 2019

![Screenshot of Mauve presenting at DTN 2019](./dtnscreen.png)

???

Sadly people didn't seem to want to install another browser and expected this stuff to work in regular chrome or firefox.
This led me to look at how we could get peer to peer web APIs into browsers through gateways and websocket proxies combined with browser to browser WebRTC connections.
In May 2019 I did my first international presentation here in Berlin about what I then called Dat Web.
The idea was that with a single JavaScript dependency you could polyfill some of the functionality of Beaker in your web app in a regular browser.
Sadly I hit limitations due to the way the web worked. Without native protocol handlers we couldn't use peer to peer URLs everywhere, and although Beaker's polyfilled DatArchive API was able to create archives, it couldn't share them accross origins or find peers without the internet.

---

class: agbg

### March 2020

![Animation of browsing through the natakanu app](./natakanu-demo.gif)

???

In March 2020 I started working for Wapikoni Mobile on an app called Natakanu.
They'd be travelling around to indigenous communities in Canada showcasing and making media and wanted a tool to share files when the internet was inaccessible.
So we built a peer to peer file transfer app that would automatically find devices on the local network or over the internet.
As part of this I learned how easy it was to add custom protocol handlers to Electron and to use them to serve files, I even managed to reuse some code from my web polyfilling project to get HTTP methods and headers wired up.
This sparked my curiosity to try making a browser of my own.

---


### June 2020

![Screenshot of DWeb Browser. Links to Mauve's blog and the Dat Foundation blog](./dwebbrowserscreen.png)

???

A few months later I did the first release of the "Dweb Browser".
And a couple days later I renamed it to Agregore after brainstorming with my friends for something a bit more unique.
A few days after that I got my first contribution to the project thanks to Metanomial from that Dat community that added context menus.
Right from the get go I wanted the project to be out in the open with room for folks to contribute small improvements without needing to get lost in build systems or put behind a CLA.

---

class: agbg

### July 2020

![JavaScript code snippet, using the fetch API to PUT the text "Hello World" to an IPFS URL](./putscreen.png)

???

In July I released a version with my foundational concept for how to treat protocol handlers on the web.
Instead of treating peer to peer URLs as something you can only GET from, I added the ability to use other verbs like PUT to write data back into them.
Instead of needing custom JavaScript APIs injected into every context, code could use the standard `fetch` API for making requests.
Adding new protocols was now more obvious, instead of emulating specific SDKs I could abstract everything behind the HTTP metaphore.

---

class: agbg

### August 2020

![Screenshot of gemtext markup language documentation](./geminiscreen.png)

???

The next month brought a new protocol, gemini which is kind of like a simplified web.
It uses TLS connections with minimal request formatting and a minimal markup language for page content.
It's not exactly peer to peer but the protocol and markup language was felt like a perfect addition.
I also added an ad blocker extension to show that the browser could be extended outside of electron builds and to make the web a more pleasant place to browse.

---

class: ipfsbg

### October 2020

![IPFS logo with the tagline "A Universe of Uses"](./ipfsscreen.png)

???

In October I landed support for the second peer to peer protocol: IPFS.
Protocol Labs has been a huge help in progressing the dweb movement and it was an obvious next choice.
Beaker had actually supported IPFS in the past but had removed it to get tighter integration with Dat.
The HTTP metaphor carried over between both protocols and meant we could resolve content that was already available from the IPFS ecosystem.

---

class: ipfsbg

### April 2021

![BitTorrent logo](./bittorrent.png)

???

A while later I added support for BitTorrent.
I'd say it's the most succesfull peer to peer protocol in use right now.
People all over the world are using it to share large files like Linux ISOs and creative commons licensed Big Buck Bunny renders.
With this addition all torrents now became websites that you can open and browse.
It also meant that people could publish peer to peer sites using existing torrent infrastructure.

---

### April 2021

![QR Code for the Agregore browser](./agregoreqr.png)

???

So, if you want decentralized identifiers you need to either make them secure or human meaningful.
In my opinion security is non negotiable so you basically have to either use a hash or a public key to identify data.
This absolutely sucks for trying to share a link when you're standing right next to each other since hostnames can be 64 characters long.
To make it easier I added a QR code generating extension which can share the current page or scan a code to open a page.
I use it to this day when I do demos on local networks so people can quickly load each others creations.

---

class: agbg

### May 2022

![Screenshot of Agregore Mobile with IPNS page](./agmobile.png)

???

In May 2022 thanks to a grant from the Filecoin Foundation we got to create what to my knowledge is the first mobile web browser with native peer to peer protocol support with a local node.
This was an important milestone because most casual users of technology these days are using some sort of mobile OS so supporting Android opened the door for a lot more people to try it out.
Sadly due to time and buget constraints we were only able to add IPFS and it's been a lot harder to iterate on compared to the Electron version.
Regardless this was a great accomplishment and I daily drive it to this day on all my Android devices.

---

class: agbg

### January 2023

![Screenshot of tutorials section from the Agregore docs](./tutorials.png)

???

Besides the browser itself, I really loved the documentation that Beaker Browser had.
In 2023 thanks to another grant from the Filecoin Foundation we got to catch up a bit with a series of example applications and tutorials for making them.
Now newcomers to Agregore can experiment with drag and drop uploads and learn how to code their own apps.

---

class: ipfsbg

### April 2023

![Distributed Press Logo](./logo-distributedpress.svg)

???

In April of that year thanks to a grant from FFDW we released a new version of Distributed Press, a tool for publishing static websites to different peer to peer protocols.
Agregore was nice for tinkering with apps and loading content, but it wasn't obvious how website authors could add peer to peer publishing to their sites.
Distributed Press makes it easy thanks to it's Github actions and CLI utilities.
It acts as the publishing side to Agregore's reader side.
Outside of the main instance run by Hypha I started my own to publish Agregore related sites and to dogfood the tool.

---

class: agbg

### September 2024

![Screenshot of llm.completion API in Agregore](./llmapi.png)

???

AI and large language models have been exploding in popularity the past few years and in September 2024 I started experimenting with local models to see if they could be useful to develop apps offline.
Depending on search engines and documentation sites can be hard to get at when fully offline.
These days you can get 7B models to spit out runnable code without needing to boil the ocean or own a powerful GPU rig.
I exposed a new API for web apps to use language model inference while keeping model control in the hands of the users.
A couple months later I did my first AI presentation showing my App Generator which would take a prompt and generate a single page appliction which would then be published to a peer to peer website.
Longer term I'm hoping to teach the generator how to use Agregore's fetch APIs so we can generate peer to peer web apps too.

---

class: agbg

### May 2025

![DWeb Scratchpad app with its default contents](./scratchpad.png)

???

Most recently I've been spending time on authoring tools.
I've released a new editor that's loosely based on JSFiddle and CodePen.
IT takes some HTML, CSS, and JavaScript and composes it into a single file to be published to peer to peer websites.
It can also take a published site and decomposes it to let you edit and republish them.
What's cools is this tool works seamlessly on mobile too.
In fact I recently edited the tool within itself in to better fit my phone screen, and now I have a customized version published entirely from my phone.
Apps that follow this convention become more hackable and remixable. If somebody has an idea for an improvement they can quickly tinker with it offline without needing to download and install complex developer tools.

---

class: agbg

### Future:

- `hyper://` on Mobile 📱
- Better AI appgen 🤖
- P2P extension stores 🏗️

???

So! That's the journey so far. The big thing I'm working on now is a new release of Agregore Mobile with a new protocol handler based on the pears ecosystem.
I'm also tinkering with the app generator with the goal of making it reliable enough to run with a local model on a phone and to conform with the format that the scratchpad can work with.
I'm also collaborating with my colleague Aklishesh who works on the peersky browser to have an interoperable standard for us to publish browser extensions over peer to peer protocols.

---

class: agbg

# 🤘 Off-Grid Software Kits 🧑‍💻

???

At the end of all this I hope we can skip expensive cloud first software and instead have off grid software kits that let us not only consume but also create information technology without needing to deal with the constraints of centralized tech.
